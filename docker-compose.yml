services:
  # Local LLM for the AI Assistant: llama.cpp's llama-server with an OpenAI-compatible API.
  # The first start downloads the model from Hugging Face into the llm-models volume (kept across restarts).
  # On a machine with an NVIDIA GPU, add the GPU file:
  #   docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d
  llm:
    image: ghcr.io/ggml-org/llama.cpp:server
    environment:
      LLAMA_ARG_HF_REPO: ${LLM_HF_MODEL:-Qwen/Qwen3-4B-GGUF:Q4_K_M}   # any GGUF model on Hugging Face, as repo:quantization
      LLAMA_ARG_ALIAS: ${LLM_MODEL:-qwen3-4b}                         # the name the API reports; must match the backend's Llm__Model
      LLAMA_ARG_CTX_SIZE: ${LLM_CONTEXT:-8192}                        # shared by all parallel slots
      LLAMA_ARG_N_PARALLEL: ${LLM_PARALLEL:-1}                        # chats answered at the same time
      LLAMA_ARG_JINJA: "true"
      LLAMA_ARG_HOST: 0.0.0.0
      LLAMA_ARG_PORT: "8080"
      LLAMA_CACHE: /models
      LLM_API_KEY: ${LLM_API_KEY:-}
    # Requires the key only when LLM_API_KEY is set (an empty key would lock everyone out).
    entrypoint: ["/bin/sh", "-c", "if [ -n \"$$LLM_API_KEY\" ]; then export LLAMA_API_KEY=\"$$LLM_API_KEY\"; fi; exec /app/llama-server"]
    volumes: [llm-models:/models]
    # Localhost only. The backend in Docker reaches it as http://llm:8080, a backend started with ./start.sh as http://localhost:8081.
    ports: ["127.0.0.1:8081:8080"]
    restart: unless-stopped
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-martontoolbox}
      POSTGRES_USER: ${POSTGRES_USER:-martontoolbox}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-before-production}
    volumes: [postgres-data:/var/lib/postgresql/data]
    ports: ["5433:5432"]
  backend:
    build: ./backend
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=${POSTGRES_DB:-martontoolbox};Username=${POSTGRES_USER:-martontoolbox};Password=${POSTGRES_PASSWORD:-change-me-before-production}
      Jwt__Key: ${JWT_KEY:-replace-this-with-a-long-random-secret-key-before-production}
      Cors__Origin: http://localhost:4200
      Payments__Provider: ${PAYMENTS_PROVIDER:-PayU}
      Payments__AmountRon: ${PAYMENTS_AMOUNT_RON:-10}
      Revolut__BaseUrl: ${REVOLUT_BASE_URL:-https://sandbox-merchant.revolut.com/}
      Revolut__ApiVersion: ${REVOLUT_API_VERSION:-2024-09-01}
      Revolut__SecretKey: ${REVOLUT_SECRET_KEY:-}
      Revolut__WebhookSigningSecret: ${REVOLUT_WEBHOOK_SECRET:-}
      PayU__TestMode: ${PAYU_TEST_MODE:-true}
      PayU__BaseUrl: ${PAYU_BASE_URL:-https://secure.payu.com/}
      PayU__PosId: ${PAYU_POS_ID:-}
      PayU__ClientId: ${PAYU_CLIENT_ID:-}
      PayU__ClientSecret: ${PAYU_CLIENT_SECRET:-}
      PayU__SecondKey: ${PAYU_SECOND_KEY:-}
      PayU__Currency: ${PAYU_CURRENCY:-RON}
      Smtp__Host: ${SMTP_HOST:-}
      Smtp__Port: ${SMTP_PORT:-587}
      Smtp__Username: ${SMTP_USERNAME:-}
      Smtp__Password: ${SMTP_PASSWORD:-}
      Smtp__FromEmail: ${SMTP_FROM_EMAIL:-}
      Frontend__BaseUrl: ${FRONTEND_BASE_URL:-http://localhost:4200}
      Backend__BaseUrl: ${BACKEND_BASE_URL:-http://localhost:8080}
      Llm__BaseUrl: ${LLM_BASE_URL:-http://llm:8080}
      Llm__Model: ${LLM_MODEL:-qwen3-4b}
      Llm__ApiKey: ${LLM_API_KEY:-}
    depends_on: [postgres, llm]
    ports: ["8080:8080"]
  frontend:
    build: ./frontend/marton-toolbox
    depends_on: [backend]
    ports: ["4200:80"]
volumes:
  postgres-data:
  llm-models:
